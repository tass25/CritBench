# Sleep-EDF Expanded dataset configuration
# 153 sleep-cassette recordings, 78-subject subset
dataset: sleep_edf
sampling_rate_hz: 100
epoch_length_s: 30
min_continuous_s: 180
preferred_continuous_s: 300
mains_frequency_hz: 50
bands:
  theta: [4, 8]
  alpha: [8, 13]
  beta: [13, 30]
  broadband: [1, 45]
  narrowband_gamma: [30, 45]
reference: average
seed: 42
